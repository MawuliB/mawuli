  <!-- Pre-paint route flag for chromeless playground experiments.
       Runs before any CSS so the body's CRT background/scanlines/cursor
       don't flash before Angular bootstraps and the component sets its class.
       Add new chromeless routes to the array below; keep it tiny. -->
  <script>
    (function () {
      var chromeless = ['/playground/the-trial'];
      var path = (window.location.pathname || '/').replace(/\/+$/, '') || '/';
      if (chromeless.indexOf(path) !== -1) {
        document.documentElement.classList.add('chromeless');
      }
    })();
  </script>
