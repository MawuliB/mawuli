<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="10" fill="#0c0c0c"/>
  <text x="8" y="49" font-family="Consolas, Monaco, 'Courier New', monospace" font-weight="900" font-size="44" fill="#33ff33" filter="url(#glow)">M</text>
  <rect x="42" y="24" width="12" height="24" fill="#33ff33" filter="url(#glow)">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
